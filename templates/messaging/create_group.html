{% extends "base.html" %}
{% block title %}Create Group - Genlink{% endblock %}
{% block content %}
<div class="container" style="max-width:700px;margin:3rem auto;">
    <h2>Create New Group</h2>
    <div style="background:white;padding:2rem;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        <form method="POST">
            <div class="mb-3"><label for="name" class="form-label">Group Name *</label><input type="text" class="form-control" id="name" name="name" required minlength="3" maxlength="100" placeholder="e.g., Tampines Community"></div>
            <div class="mb-3"><label for="description" class="form-label">Description (Optional)</label><textarea class="form-control" id="description" name="description" maxlength="500" rows="3" placeholder="What is this group about?"></textarea></div>
            <div class="mb-3">
                <label class="form-label">Select Members *</label>
                <div style="max-height:300px;overflow-y:auto;border:2px solid #e0e0e0;border-radius:8px;">
                    {% if contacts %}{% for c in contacts %}
                    <label style="display:flex;align-items:center;gap:1rem;padding:1rem;cursor:pointer;border-bottom:1px solid #e0e0e0;">
                                                <input type="checkbox" name="members" value="{{ c.contact_user_id }}" style="width:18px;height:18px;">
                                                <div style="width:40px;height:40px;background:#ff6b35;border-radius:50%;display:flex;align-items:center;justify-content:center;color:white;font-weight:bold;overflow:hidden;">
                                                    {% if c.contact_profile_picture %}
                                                        <img src="{{ url_for('static', filename=c.contact_profile_picture.replace('static/', '').replace('\\', '/')) }}" alt="Profile" style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover;">
                                                    {% else %}
                                                        {{ (c.contact_display_name or '?')[0].upper() }}
                                                    {% endif %}
                                                </div>
                                                <div><div style="font-weight:500;">{{ c.nickname or c.contact_display_name }}</div><div style="font-size:0.85rem;color:#666;">@{{ c.contact_username }}</div></div>
                    </label>
                    {% endfor %}{% else %}<p style="color:#999;text-align:center;padding:2rem;">Add contacts first. <a href="{{ url_for('messaging.view_contacts') }}">Go to Contacts</a></p>{% endif %}
                </div>
            </div>
            <div style="display:flex;gap:1rem;margin-top:2rem;"><button type="submit" class="btn btn-primary" {% if not contacts %}disabled{% endif %}>Create Group</button><a href="{{ url_for('messaging.view_contacts') }}" class="btn btn-secondary">Cancel</a></div>
        </form>
    </div>
</div>
{% endblock %}
