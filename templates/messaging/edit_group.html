{% extends "base.html" %}
{% block title %}Edit Group - Genlink{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;margin:3rem auto;">
    <h2>Edit Group</h2>
    <div style="background:white;padding:2rem;border-radius:12px;">
        <form method="POST">
            <div class="mb-3"><label for="name" class="form-label">Group Name *</label><input type="text" class="form-control" id="name" name="name" value="{{ group.name }}" required minlength="3" maxlength="100"></div>
            <div class="mb-3"><label for="description" class="form-label">Description</label><textarea class="form-control" id="description" name="description" maxlength="500" rows="3">{{ group.description or '' }}</textarea></div>
            <div style="display:flex;gap:1rem;"><button type="submit" class="btn btn-primary">Save Changes</button><a href="{{ url_for('messaging.chat_group', group_id=group.id) }}" class="btn btn-secondary">Cancel</a></div>
        </form>
        {% if group.created_by == current_user.id %}<hr style="margin:2rem 0;"><form method="POST" action="{{ url_for('messaging.delete_group', group_id=group.id) }}" onsubmit="return confirm('Delete this group permanently?');"><button type="submit" class="btn btn-danger">Delete Group</button></form>{% endif %}
    </div>
</div>
{% endblock %}
