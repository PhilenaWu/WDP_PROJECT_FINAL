{% extends "base.html" %}
{% block title %}Edit Message - Genlink{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;margin:3rem auto;">
    <h2>Edit Message</h2>
    <div style="background:white;padding:2rem;border-radius:12px;">
        <form method="POST">
            <div class="mb-3"><label for="content" class="form-label">Message Content *</label><textarea class="form-control" id="content" name="content" required maxlength="5000" rows="5">{{ message.content }}</textarea></div>
            <div style="display:flex;gap:1rem;"><button type="submit" class="btn btn-primary">Save Changes</button><a href="javascript:history.back()" class="btn btn-secondary">Cancel</a></div>
        </form>
    </div>
</div>
{% endblock %}
