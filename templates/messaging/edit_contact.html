{% extends "base.html" %}
{% block title %}Edit Contact - Genlink{% endblock %}
{% block content %}
<div class="container" style="max-width:600px;margin:3rem auto;">
    <h2>Edit Contact</h2>
    <div style="background:white;padding:2rem;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,0.1);">
        <form method="POST">
            <div class="mb-3"><label class="form-label">Contact: <strong>{{ contact.contact_display_name }}</strong></label></div>
            <div class="mb-3"><label for="nickname" class="form-label">Nickname (Optional)</label><input type="text" class="form-control" id="nickname" name="nickname" value="{{ contact.nickname or '' }}" placeholder="e.g., Uncle Lim" minlength="2" maxlength="50"></div>
            <div class="mb-3"><div class="form-check"><input class="form-check-input" type="checkbox" name="is_favorite" id="is_favorite" {% if contact.is_favorite %}checked{% endif %}><label class="form-check-label" for="is_favorite">Mark as favorite</label></div></div>
            <div style="display:flex;gap:1rem;"><button type="submit" class="btn btn-primary">Save Changes</button><a href="{{ url_for('messaging.view_contacts') }}" class="btn btn-secondary">Cancel</a></div>
        </form>
    </div>
</div>
{% endblock %}
