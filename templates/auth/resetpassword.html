{% extends "base.html" %}

{% block title %}Reset Password{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
<div class="container-fluid vh-100">
    <div class="row h-100">
        <div class="col-md-4 d-none d-md-flex align-items-center justify-content-center bg-light">
            <div class="text-center">
                <img src="{{ url_for('static', filename='uploads/profile_pics/logo.png') }}" alt="StoryConnect Logo" class="auth-logo-large">
            </div>
        </div>

        <div class="col-md-8 d-flex align-items-center justify-content-center">
            <div class="w-100 auth-form-container">
                <div class="text-center mb-4">
                    <h2>Reset Password</h2>
                    <p class="text-muted">Set your new password below.</p>
                </div>

                <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
                    {% if error %}
                        <p class="auth-error-message">{{ error }}</p>
                    {% endif %}

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> New Password
                        </label>
                        <div class="password-input-wrapper">
                            <input type="password" class="form-control" id="password" name="password" required>
                            <button type="button" class="eye-icon" id="reset-eye-password" aria-label="Show password"></button>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="confirm_password" class="form-label">
                            <i class="bi bi-lock-fill"></i> Confirm Password
                        </label>
                        <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
                        Update Password
                    </button>

                    <div class="text-center">
                        <a href="{{ url_for('auth.login') }}" class="text-primary-color">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function bindEyeToggle(buttonId, inputId) {
        const eyeBtn = document.getElementById(buttonId);
        const pwdInput = document.getElementById(inputId);

        if (!eyeBtn || !pwdInput) {
            return;
        }

        eyeBtn.addEventListener('click', () => {
            const isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            eyeBtn.classList.toggle('open', isHidden);
            eyeBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        });
    }

    bindEyeToggle('reset-eye-password', 'password');
</script>
{% endblock %}
