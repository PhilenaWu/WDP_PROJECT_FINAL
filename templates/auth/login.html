{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
<div class="container-fluid vh-100">
    <div class="row h-100">
        <!-- Left side - Logo/Branding -->
        <div class="col-md-4 d-none d-md-flex align-items-center justify-content-center bg-light">
            <div class="text-center">
                <img src="{{ url_for('static', filename='uploads/profile_pics/logo.png') }}" alt="StoryConnect Logo" class="auth-logo-large">
            </div>
        </div>
        
        <!-- Right side - Login Form -->
        <div class="col-md-8 d-flex align-items-center justify-content-center">
            <div class="w-100 auth-form-container">
                <div class="text-center mb-4">
                    <h2>Login</h2>
                    <p class="text-muted">Sign in to your account</p>
                </div>
                
                <form method="POST">
                    <!-- Error Message with Countdown -->
                    {% if error %}
                        <p class="auth-error-message" id="errorMessage">
                            {{ error }}
                            {% if lockout_seconds %} 
                                <span id="countdown"></span>
                                <input type="hidden" id="lockout-seconds" value="{{ lockout_seconds }}">
                            {% endif %}
                        </p>
                    {% endif %}
                    
                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            <i class="bi bi-person"></i> Username
                        </label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    
                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            <i class="bi bi-lock"></i> Password
                        </label>
                        <div class="password-input-wrapper">
                            <input type="password" class="form-control" id="password" name="password" required>
                            <button
                              type="button"
                              class="eye-icon"
                              id="signin-eye"
                              aria-label="Show password"
                            ></button>
                        </div>
                    </div>
                    
                    <!-- Login Button -->
                    <button type="submit" class="btn btn-primary w-100 py-2 mb-3 signin-login">
                        Login
                    </button>
                    
                    <!-- Signup Link -->
                    <div class="text-center">
                        <p class="mb-0">Don't have an account? 
                            <a href="{{ url_for('auth.signup') }}" class="text-primary-color">Sign up</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // Toggle password visibility
    const eyeBtn = document.getElementById('signin-eye');
    const pwdInput = document.getElementById('password');
    
    if (eyeBtn && pwdInput) {
        eyeBtn.addEventListener('click', () => {
            const isHidden = pwdInput.type === 'password';
            pwdInput.type = isHidden ? 'text' : 'password';
            eyeBtn.classList.toggle('open', isHidden);
            eyeBtn.setAttribute(
                'aria-label',
                isHidden ? 'Hide password' : 'Show password'
            );
        });
    }

    // Lockout countdown 
    const lockoutInput = document.getElementById('lockout-seconds');
    let remainingSeconds = parseInt(lockoutInput?.value, 10) || 0;

    if (remainingSeconds > 0) {
        const countdownElement = document.getElementById('countdown');
        const usernameInput = document.querySelector('input[name="username"]');
        const passwordInput = document.querySelector('input[name="password"]');
        const loginButton = document.querySelector('.signin-login');

        // Disable inputs during lockout
        usernameInput.disabled = true;
        passwordInput.disabled = true;
        eyeBtn.disabled = true;
        loginButton.disabled = true;
        loginButton.style.opacity = '0.5';
        loginButton.style.cursor = 'not-allowed';

        function updateCountdown() {
            if (remainingSeconds <= 0) {
                countdownElement.textContent = '';
                document.getElementById('errorMessage').textContent =
                    'You can now try logging in again.';
                usernameInput.disabled = false;
                passwordInput.disabled = false;
                eyeBtn.disabled = false;
                loginButton.disabled = false;
                loginButton.style.opacity = '1';
                loginButton.style.cursor = 'pointer';
                return;
            }

            const minutes = Math.floor(remainingSeconds / 60);
            const seconds = remainingSeconds % 60;
            countdownElement.textContent =
                ` Please try again in ${minutes}m ${seconds}s.`;

            remainingSeconds--;
            setTimeout(updateCountdown, 1000);
        }

        updateCountdown();
    }
</script>
{% endblock %}
