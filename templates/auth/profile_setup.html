{% extends "base.html" %}

{% block title %}About You{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <!-- Progress indicator -->
            <div class="mb-4">
                <div class="d-flex justify-content-between mb-2">
                    <span class="badge bg-success">Step 1: Complete</span>
                    <span class="badge bg-primary">Step 2: About You</span>
                    <span class="badge bg-secondary">Step 3: Interests</span>
                    <span class="badge bg-secondary">Step 4: Connect</span>
                </div>
                <div class="progress" style="height: 8px;">
                    <div class="progress-bar" role="progressbar" style="width: 50%; background-color: #ff6b35;"></div>
                </div>
            </div>
            
            <div class="card shadow">
                <div class="card-body p-4">
                    <h2 class="card-title text-center mb-4">About You</h2>
                    
                    <form method="POST" enctype="multipart/form-data">
                        <!-- First Name -->
                        <div class="mb-3">
                            <label for="first_name" class="form-label">First Name</label>
                            <input type="text" class="form-control" id="first_name" name="first_name" required>
                        </div>
                        
                        <!-- Last Name -->
                        <div class="mb-3">
                            <label for="last_name" class="form-label">Last Name</label>
                            <input type="text" class="form-control" id="last_name" name="last_name" required>
                        </div>
                        
                        <!-- Display Name -->
                        <div class="mb-3">
                            <label for="display_name" class="form-label">Display Name</label>
                            <input type="text" class="form-control" id="display_name" name="display_name" 
                                   placeholder="How should we call you?" required>
                        </div>
                        
                        <!-- Date of Birth -->
                        <div class="mb-3">
                            <label for="date_of_birth" class="form-label">Date of Birth (dd/mm/yyyy)</label>
                            <input type="date" class="form-control" id="date_of_birth" name="date_of_birth" required>
                            <div id="age_display" class="form-text"></div>
                        </div>
                        
                        <!-- Phone Number -->
                        <div class="mb-3">
                            <label for="phone_number" class="form-label">
                                <i class="bi bi-telephone"></i> Phone Number
                            </label>
                            <input type="tel" class="form-control" id="phone_number" name="phone_number" 
                                   placeholder="+65 XXXX XXXX">
                        </div>
                        
                        <!-- Profile Picture -->
                        <div class="mb-3">
                            <label for="profile_picture" class="form-label">
                                <i class="bi bi-image"></i> Profile Picture
                            </label>
                            <input type="file" class="form-control" id="profile_picture" name="profile_picture" 
                                   accept="image/*">
                            <small class="text-muted">Optional - Max 5MB (PNG, JPG, JPEG, GIF)</small>
                        </div>
                        
                        <!-- Location Sync -->
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="location_enabled" 
                                       name="location_enabled">
                                <label class="form-check-label" for="location_enabled">
                                    <i class="bi bi-geo-alt"></i> Sync up location
                                </label>
                            </div>
                        </div>
                        
                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary w-100 py-2" 
                                style="background-color: #ff6b35; border: none;">
                            Next <i class="bi bi-arrow-right"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/profile_setup.js') }}"></script>
{% endblock %}
