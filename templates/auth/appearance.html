{% extends "base.html" %}

{% block title %}Appearance | Genlink{% endblock %}
{% block body_class %}class="appearance-page"{% endblock %}

{% block content %}
<div class="settings-layout">
	<aside class="settings-sidebar">
		<h2 class="sidebar-heading">Settings</h2>

		<nav class="sidebar-menu">
			<button class="menu-item menu-item--active" type="button" aria-current="page">Appearance</button>
			<a href="{{ url_for('auth.language_settings') }}" class="menu-item">Language</a>
			<a href="{{ url_for('auth.logout') }}" class="menu-item">Log Out</a>
		</nav>
		<div class="sidebar-footer">
			<a href="{{ url_for('main.home') }}" class="btn btn-light sidebar-home-btn">
				<span class="sidebar-home-icon" aria-hidden="true">
					<i class="bi bi-arrow-left"></i>
				</span>
				<span class="sidebar-home-text">Back to Home</span>
			</a>
		</div>
	</aside>

	<div class="settings-divider"></div>

	<main class="settings-main">
		<div class="settings-header">
			<h1 class="main-title">Appearance</h1>
		</div>

		<section class="appearance-content">
			<div class="theme-section">
				<div class="theme-cards">
					<label class="theme-card theme-card--active">
						<input type="radio" name="theme" value="light" checked>
						<div class="theme-preview theme-preview--light">
							<div class="preview-header"></div>
							<div class="preview-content">
								<div class="preview-line"></div>
								<div class="preview-line"></div>
								<div class="preview-line short"></div>
							</div>
						</div>
						<span class="theme-label">Light Mode</span>
						<span class="theme-check" aria-hidden="true">✓</span>
					</label>

					<label class="theme-card">
						<input type="radio" name="theme" value="dark">
						<div class="theme-preview theme-preview--dark">
							<div class="preview-header"></div>
							<div class="preview-content">
								<div class="preview-line"></div>
								<div class="preview-line"></div>
								<div class="preview-line short"></div>
							</div>
						</div>
						<span class="theme-label">Dark Mode</span>
						<span class="theme-check" aria-hidden="true">✓</span>
					</label>
				</div>
			</div>

			<div class="setting-group">
				<label class="setting-label" for="textSize">Text Size</label>
				<div class="slider-container">
					<input type="range" id="textSize" class="text-slider" min="12" max="48" value="32" step="1">
					<span class="slider-value" id="textSizeValue">32</span>
				</div>
			</div>

			<div class="setting-group">
				<label class="setting-label">Bold</label>
				<div class="bold-options">
					<button type="button" class="bold-btn" data-weight="300">Light</button>
					<button type="button" class="bold-btn bold-btn--active" data-weight="500">Medium</button>
					<button type="button" class="bold-btn" data-weight="700">Dark</button>
				</div>
			</div>

			<div class="setting-group">
				<label class="setting-label" for="fontStyle">Font Style</label>
				<select class="font-select" id="fontStyle">
					<option value="arial" selected>Arial</option>
					<option value="verdana">Verdana</option>
					<option value="tahoma">Tahoma</option>
					<option value="trebuchet">Trebuchet MS</option>
					<option value="georgia">Georgia</option>
					<option value="times">Times New Roman</option>
					<option value="courier">Courier New</option>
				</select>
			</div>

			<div class="appearance-actions">
				<button type="button" class="btn btn-light" id="appearanceDefaultBtn">Default</button>
				<button type="button" class="btn btn-orange" id="appearanceSaveBtn">Save Changes</button>
			</div>
		</section>
	</main>
</div>
{% endblock %}

{% block extra_js %}
<script>
	const appearanceManager = window.genlinkAppearance;
	let initialSettings = appearanceManager.getSaved();

	const themeCards = document.querySelectorAll('.theme-card');
	const themeRadios = document.querySelectorAll('input[name="theme"]');
	const textSizeSlider = document.getElementById('textSize');
	const textSizeValue = document.getElementById('textSizeValue');
	const boldButtons = document.querySelectorAll('.bold-btn');
	const fontStyleSelect = document.getElementById('fontStyle');
	const defaultBtn = document.getElementById('appearanceDefaultBtn');
	const saveBtn = document.getElementById('appearanceSaveBtn');

	let currentSettings = { ...initialSettings };

	async function syncAppearanceToDatabase(settings) {
		const response = await fetch("{{ url_for('auth.update_appearance') }}", {
			method: 'POST',
			headers: {
				'Content-Type': 'application/json'
			},
			body: JSON.stringify({
				theme: settings.theme,
				text_size: settings.textSize,
				font_style: settings.fontStyle,
				font_weight: settings.fontWeight
			})
		});

		if (!response.ok) {
			throw new Error('Failed to save appearance settings.');
		}
	}

	function syncControls(settings) {
		themeRadios.forEach(radio => {
			radio.checked = radio.value === settings.theme;
		});

		themeCards.forEach(card => {
			const cardTheme = card.querySelector('input[name="theme"]').value;
			card.classList.toggle('theme-card--active', cardTheme === settings.theme);
		});

		textSizeSlider.value = settings.textSize;
		textSizeValue.textContent = settings.textSize;

		boldButtons.forEach(button => {
			button.classList.toggle('bold-btn--active', button.dataset.weight === settings.fontWeight);
		});

		fontStyleSelect.value = settings.fontStyle;
	}

	function applyAndPersist() {
		currentSettings = appearanceManager.applyAppearance(currentSettings);
		appearanceManager.saveAppearance(currentSettings);
	}

	syncControls(currentSettings);
	applyAndPersist();

	themeRadios.forEach(radio => {
		radio.addEventListener('change', function() {
			themeCards.forEach(card => {
				card.classList.remove('theme-card--active');
			});

			if (this.checked) {
				this.closest('.theme-card').classList.add('theme-card--active');
				currentSettings.theme = this.value;
				applyAndPersist();
			}
		});
	});

	textSizeSlider.addEventListener('input', function() {
		textSizeValue.textContent = this.value;
		currentSettings.textSize = Number(this.value);
		applyAndPersist();
	});

	boldButtons.forEach(btn => {
		btn.addEventListener('click', function() {
			boldButtons.forEach(b => b.classList.remove('bold-btn--active'));
			this.classList.add('bold-btn--active');
			currentSettings.fontWeight = this.dataset.weight;
			applyAndPersist();
		});
	});

	fontStyleSelect.addEventListener('change', function() {
		currentSettings.fontStyle = this.value;
		applyAndPersist();
	});

	defaultBtn.addEventListener('click', async function() {
		const defaultSettings = { ...appearanceManager.defaults };

		currentSettings = { ...defaultSettings };
		syncControls(currentSettings);
		applyAndPersist();

		try {
			await syncAppearanceToDatabase(currentSettings);
			initialSettings = { ...currentSettings };
		} catch (error) {
			console.error(error);
			alert('Could not reset to default settings. Please try again.');
		}
	});

	saveBtn.addEventListener('click', async function() {
		try {
			await syncAppearanceToDatabase(currentSettings);
			initialSettings = { ...currentSettings };
			appearanceManager.saveAppearance(initialSettings);
		} catch (error) {
			console.error(error);
			alert('Could not save appearance settings. Please try again.');
		}
	});

</script>
{% endblock %}
