<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}StoryConnect{% endblock %}</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    {% block extra_css %}{% endblock %}
</head>
<body {% block body_class %}{% endblock %}>
    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="container mt-3">
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}
    
    {% block content %}{% endblock %}

    <div id="google_translate_element" style="display:none;"></div>
    
    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        const userLang = "{{ current_user.language if current_user.is_authenticated else '' }}";

        if (userLang) {
            localStorage.setItem('siteLanguage', userLang);
        }

        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                {
                    pageLanguage: 'en',
                    includedLanguages: 'en,zh-CN,ta,ms',
                    autoDisplay: false
                },
                'google_translate_element'
            );
        }

        function setSiteLanguage(lang) {
            const select = document.querySelector('.goog-te-combo');
            if (!select) {
                return;
            }
            select.value = lang;
            select.dispatchEvent(new Event('change'));
            localStorage.setItem('siteLanguage', lang);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const stored = localStorage.getItem('siteLanguage');
            if (!stored) {
                return;
            }
            const interval = setInterval(() => {
                const select = document.querySelector('.goog-te-combo');
                if (select) {
                    select.value = stored;
                    select.dispatchEvent(new Event('change'));
                    clearInterval(interval);
                }
            }, 200);
            setTimeout(() => clearInterval(interval), 4000);
        });
    </script>
    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    {% block extra_js %}{% endblock %}
</body>
</html>
